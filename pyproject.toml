[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "integrated-script"
version = "3.0.1"
description = "一个模块化的数据处理整合脚本项目"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Integrated Script Team", email = "team@example.com"},
]
keywords = ["yolo", "dataset", "processing", "computer-vision", "data-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# 运行期依赖：基础安装即可运行 TUI + 旧交互界面，不引入 Qt。
dependencies = [
    "tqdm>=4.64.0",
    "Pillow>=9.0.0",
    "opencv-python-headless>=4.5.0",
    "PyYAML>=6.0",
    "requests>=2.28.0",
    "platformdirs>=4.0.0",
    "textual>=8.0,<9",
]

[project.optional-dependencies]
# Qt 桌面界面为显式可选组件，TUI 与核心逻辑不依赖 Qt。
# 构建锁 requirements-build-gui.txt 固定为 6.8.3（见 docs/offline-deployment.md）。
gui = [
    "PySide6==6.8.3",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.991",
    "pre-commit>=2.20.0",
]
# 界面相关测试（GUI/TUI）所需的额外工具链。
dev-ui = [
    "pytest-qt>=4.4.0",
    "pytest-asyncio>=0.23.0",
]
# 离线可执行文件构建链（构建机可联网，产物离线运行）。
build = [
    "pyinstaller>=6.10",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]
optional = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
]

[project.scripts]
# 默认入口：Textual 终端界面（TUI）。
integrated-script = "integrated_script.main:main"

[project.gui-scripts]
# Windows 下生成无控制台窗口的 GUI 启动器；macOS/Linux 行为等同普通入口。
integrated-script-gui = "integrated_script.main:gui_main"

[project.urls]
"Homepage" = "https://github.com/haohex/integrated_script"
"Bug Reports" = "https://github.com/haohex/integrated_script/issues"
"Source" = "https://github.com/haohex/integrated_script"
"Documentation" = "https://integrated-script.readthedocs.io/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 离线运行所需的本地资源：配置模板、本地图标与许可证。
integrated_script = [
    "config/*.json",
    "config/*.yaml",
    "config/*.yml",
    "assets/icons/*.svg",
    "assets/icons/LICENSE",
    "assets/**/*.png",
    "assets/**/*.ico",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.flake8]
max-line-length = 120
extend-ignore = "E203,W503"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    ".tox",
]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".git", "__pycache__", "build", "dist", ".eggs", "*.egg-info", ".venv", ".tox"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = false
warn_unreachable = false
strict_equality = false
ignore_missing_imports = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
required_plugins = ["pytest-cov"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m 'not slow'')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
