name: Build Artifacts

on:
  push:
    branches: ['dev/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  quality:
    uses: ./.github/workflows/code-quality.yml

  build:
    name: Build and run (${{ matrix.name }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2022
            platform: windows
            arch: x64
            gui: true
          - name: linux-x64
            runner: ubuntu-22.04
            platform: linux
            arch: x64
            gui: true
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            gui: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch }}
      - name: Install Linux GUI and automation libraries
        if: runner.os == 'Linux' && matrix.gui
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth xdotool imagemagick libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3 libfontconfig1 fonts-noto-cjk
      - name: Install locked build and acceptance tools
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ matrix.gui }}' = 'true' ]; then
            python -m pip install -r requirements-build-gui.txt
          else
            python -m pip install -r requirements-build.txt
          fi
          python -m pip install -r requirements-acceptance.txt
          python -m pip install -e . --no-deps
      - name: Native desktop and DPI acceptance (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          QT_QPA_PLATFORM: windows
        run: |
          set -euo pipefail
          for scale in 1 1.25 1.5 1.75 2; do
            python tests/ui/native_acceptance.py --output "acceptance/native-$scale" --scale "$scale"
          done
      - name: Native desktop acceptance (Linux)
        if: runner.os == 'Linux' && matrix.gui
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s '-screen 0 2560x1600x24' python tests/ui/native_acceptance.py --output acceptance/native-1 --scale 1
      - name: Build terminal bundle
        run: python build_exe.py --mode tui
      - name: Build desktop bundle
        if: matrix.gui
        run: python build_exe.py --mode gui
      - name: Package and extract the distribution archives
        shell: bash
        env:
          ARTIFACT_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: |
          set -euo pipefail
          python scripts/verify_artifacts.py prepare --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}' --tag "$ARTIFACT_TAG"
          python scripts/verify_artifacts.py extract --directory dist/artifacts --destination extracted
      - name: Block packaged executables from network (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($item in @('integrated_script', 'integrated_script_gui')) {
            $exe = (Resolve-Path "extracted/$item/$item.exe").Path
            New-NetFirewallRule -DisplayName "IntegratedScript-Acceptance-$item" -Direction Outbound -Program $exe -Action Block -Profile Any | Format-List DisplayName,Enabled,Action,Program
          }
      - name: Run extracted terminal bundle (Windows ConPTY)
        if: runner.os == 'Windows'
        env:
          ACCEPTANCE_NETWORK_ISOLATION: Windows outbound program firewall rule
        run: python scripts/frozen_tui_smoke.py --executable extracted/integrated_script/integrated_script.exe --output acceptance/frozen-tui
      - name: Run extracted desktop bundle (Windows)
        if: runner.os == 'Windows'
        env:
          ACCEPTANCE_NETWORK_ISOLATION: Windows outbound program firewall rule
        run: python tests/ui/frozen_gui_smoke.py --executable extracted/integrated_script_gui/integrated_script_gui.exe --output acceptance/frozen-gui
      - name: Run extracted terminal bundle without networking (Linux PTY)
        if: runner.os == 'Linux'
        env:
          ACCEPTANCE_NETWORK_ISOLATION: Linux isolated network namespace
        run: sudo -E unshare --net "$(command -v python)" scripts/frozen_tui_smoke.py --executable extracted/integrated_script/integrated_script --output acceptance/frozen-tui
      - name: Run extracted desktop bundle without networking (Linux X11)
        if: runner.os == 'Linux' && matrix.gui
        env:
          QT_QPA_PLATFORM: xcb
          ACCEPTANCE_NETWORK_ISOLATION: Linux isolated network namespace
        run: xvfb-run -a -s '-screen 0 2560x1600x24' sudo -E unshare --net "$(command -v python)" tests/ui/frozen_gui_smoke.py --executable extracted/integrated_script_gui/integrated_script_gui --output acceptance/frozen-gui
      - name: Remove acceptance firewall rules
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Get-NetFirewallRule -DisplayName 'IntegratedScript-Acceptance-*' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.name }}
          path: acceptance/
          if-no-files-found: warn
      - name: Upload verified offline packages
        uses: actions/upload-artifact@v4
        with:
          name: offline-${{ matrix.name }}
          path: dist/artifacts/*
          if-no-files-found: error

  linux-24-runtime:
    name: Run Linux x64 packages on Ubuntu 24.04
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install acceptance tools and desktop libraries
        run: |
          python -m pip install -r requirements-acceptance.txt
          sudo apt-get update
          sudo apt-get install -y xvfb xauth xdotool imagemagick libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3 libfontconfig1 fonts-noto-cjk
      - uses: actions/download-artifact@v4
        with:
          name: offline-linux-x64
          path: packages
      - name: Verify and extract
        run: python scripts/verify_artifacts.py extract --directory packages --destination extracted
      - name: Run frozen terminal with no network
        env:
          ACCEPTANCE_NETWORK_ISOLATION: Linux isolated network namespace
        run: sudo -E unshare --net "$(command -v python)" scripts/frozen_tui_smoke.py --executable extracted/integrated_script/integrated_script --output acceptance/frozen-tui
      - name: Run frozen desktop with no network
        env:
          QT_QPA_PLATFORM: xcb
          ACCEPTANCE_NETWORK_ISOLATION: Linux isolated network namespace
        run: xvfb-run -a -s '-screen 0 2560x1600x24' sudo -E unshare --net "$(command -v python)" tests/ui/frozen_gui_smoke.py --executable extracted/integrated_script_gui/integrated_script_gui --output acceptance/frozen-gui
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-linux-24
          path: acceptance/
          if-no-files-found: warn
