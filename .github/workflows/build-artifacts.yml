name: Build Artifacts

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            runner: windows-latest
            exe_name: integrated_script.exe
            out_name: integrated_script-${{ github.ref_name }}-windows-amd64.exe
          # Linux 在 manylinux2014 容器（glibc 2.17）中构建，产物可在 CentOS 7 / Ubuntu 18.04 及更新的发行版运行。
          - name: linux-amd64
            runner: ubuntu-latest
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
            smoke_image: centos:7
            exe_name: integrated_script
            out_name: integrated_script-${{ github.ref_name }}-linux-amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
            smoke_image: centos:7
            exe_name: integrated_script
            out_name: integrated_script-${{ github.ref_name }}-linux-arm64

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache uv downloads
      uses: actions/cache@v4
      with:
        path: .cache/uv
        key: uv-${{ matrix.name }}-${{ hashFiles('requirements.txt') }}
        restore-keys: uv-${{ matrix.name }}-

    - uses: actions/setup-python@v5
      if: ${{ runner.os == 'Windows' }}
      with:
        python-version: '3.11'

    - uses: astral-sh/setup-uv@v6
      if: ${{ runner.os == 'Windows' }}

    - name: Build (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: bash
      env:
        UV_CACHE_DIR: .cache/uv
      run: |
        uv venv --python "$(python -c 'import sys; print(sys.executable)')" .build-venv
        uv pip install --python .build-venv --only-binary :all: -r requirements.txt -r scripts/ci/build-requirements.txt
        uv pip list --python .build-venv
        .build-venv/Scripts/python build_exe.py

    - name: Build (Linux, manylinux2014)
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        docker run --rm \
          -v "$PWD:/work" -w /work \
          -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
          ${{ matrix.manylinux_image }} \
          bash scripts/ci/build_linux.sh

    - name: Rename executable with release tag
      id: rename
      shell: bash
      env:
        OUT_NAME: ${{ matrix.out_name }}
      run: |
        # 分支上手动触发时 ref_name 可能含 "/"，替换掉以免变成子目录。
        out="dist/${OUT_NAME//\//-}"
        mv "dist/${{ matrix.exe_name }}" "$out"
        echo "path=$out" >> "$GITHUB_OUTPUT"

    - name: Smoke test (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: bash
      run: bash scripts/ci/smoke_test.sh "${{ steps.rename.outputs.path }}"

    - name: Smoke test (Linux, ${{ matrix.smoke_image }})
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        # 依次验证：正常 /tmp；/tmp 为 noexec（应改用 /var/tmp）；
        # /tmp 和 /var/tmp 都为 noexec（应回退到 $HOME/.cache）。
        for tmpfs_args in "" \
            "--tmpfs /tmp:rw,noexec,nosuid" \
            "--tmpfs /tmp:rw,noexec,nosuid --tmpfs /var/tmp:rw,noexec,nosuid"; do
          echo "::group::smoke test ${tmpfs_args:-(default /tmp)}"
          docker run --rm -v "$PWD:/work" -w /work $tmpfs_args \
            ${{ matrix.smoke_image }} \
            bash scripts/ci/smoke_test.sh "${{ steps.rename.outputs.path }}"
          echo "::endgroup::"
        done

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: ${{ steps.rename.outputs.path }}
        if-no-files-found: error
