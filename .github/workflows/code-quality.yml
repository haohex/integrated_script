name: Code Quality Check

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*.*.*'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  code-quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    env:
      # Modal unit tests are deterministic offscreen; build-artifacts separately
      # runs real Windows/X11 desktop acceptance and extracted GUI automation.
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3 libfontconfig1 fonts-noto-cjk
      - name: Install locked development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Full quality gate
        shell: bash
        env:
          HOME: ${{ runner.temp }}/quality-state/home
          USERPROFILE: ${{ runner.temp }}/quality-state/home
          XDG_CONFIG_HOME: ${{ runner.temp }}/quality-state/config
          XDG_STATE_HOME: ${{ runner.temp }}/quality-state/state
          XDG_CACHE_HOME: ${{ runner.temp }}/quality-state/cache
          XDG_DATA_HOME: ${{ runner.temp }}/quality-state/data
          APPDATA: ${{ runner.temp }}/quality-state/roaming
          LOCALAPPDATA: ${{ runner.temp }}/quality-state/local
        run: |
          set -euo pipefail
          python -m flake8 --max-line-length=120 --extend-ignore=E203,W503 src/integrated_script tests scripts main.py build_exe.py
          python -m black --target-version py311 --check src tests scripts main.py build_exe.py
          python -m isort --check-only src tests scripts main.py build_exe.py
          python -m mypy src/integrated_script
          python -m pytest tests --junitxml=quality-results.xml
      - name: Upload quality results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.os }}
          path: quality-results.xml
          if-no-files-found: ignore
